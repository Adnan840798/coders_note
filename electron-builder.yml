appId: com.codersnote.app
productName: Coders Note
copyright: Copyright © 2024 coders_note contributors

directories:
  buildResources: build
  output: release

files:
  - out
  - '!out/**/*.map'

# Unpack native bindings (.node files) so Electron can load them from outside the asar
asarUnpack:
  - "**/*.node"

# Copy SQL migrations into resources/ so the packaged app can run them at startup
extraResources:
  - from: electron/db/migrations
    to: migrations
    filter:
      - "*.sql"
  - from: build/icon.png
    to: icon.png
  - from: build/tray-icon.png
    to: tray-icon.png

extraMetadata:
  main: out/main/index.js

win:
  # signAndEditExecutable=false skips rcedit resource stamping AND signing,
  # which avoids the winCodeSign download that fails on Windows without Developer Mode.
  signAndEditExecutable: false
  target:
    - target: portable
      arch:
        - x64
  icon: build/icon.ico

portable:
  artifactName: "Coders-Note-${version}-portable.exe"
