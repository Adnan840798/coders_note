appId: com.codersnote.app
productName: Coders Note
copyright: Copyright © 2024 coders_note contributors

directories:
  buildResources: build
  output: release

files:
  - out
  - '!out/**/*.map'

extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/tray-icon.png
    to: tray-icon.png

extraMetadata:
  main: out/main/index.js

win:
  target:
    - target: portable
      arch:
        - x64
  icon: build/icon.ico

portable:
  artifactName: "Coders-Note-${version}-portable.exe"
