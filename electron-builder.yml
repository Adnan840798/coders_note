appId: com.codersnote.app
productName: Coders Note
copyright: Copyright © 2024 coders_note contributors

directories:
  buildResources: build
  output: release

files:
  - out
  - '!out/**/*.map'

extraMetadata:
  main: out/main/index.js

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.developer-tools

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icon.png
  category: Development

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

afterSign: scripts/notarize.js
